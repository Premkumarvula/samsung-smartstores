# /etc/nginx/conf.d/smartstore.conf
#
# Reverse proxy: Nginx (port 80/443) -> Gunicorn (127.0.0.1:8000).
# Serves static files directly (never proxied to Gunicorn) to keep the
# app process free for actual request handling on a memory-constrained
# t3.micro instance.

upstream smartstore_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2M;

    access_log /var/log/nginx/smartstore.access.log;
    error_log  /var/log/nginx/smartstore.error.log;

    location /static/ {
        alias /opt/smartstore/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health {
        proxy_pass http://smartstore_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://smartstore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
