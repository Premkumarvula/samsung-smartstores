name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (fail only on real errors, not style nits)
        run: flake8 app wsgi.py run.py seed.py --max-line-length=120 --select=E9,F63,F7,F82

      - name: Smoke test app import + health check
        env:
          FLASK_ENV: testing
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app("testing")
          client = app.test_client()
          with app.app_context():
              from app.extensions import db
              db.create_all()
          response = client.get("/health")
          assert response.status_code == 200, response.data
          print("Health check OK:", response.get_json())
          PY

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/smartstore
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            flask seed-db || true
            sudo systemctl restart smartstore
            sleep 3
            curl -f http://127.0.0.1:8000/health
