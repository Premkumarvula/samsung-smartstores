name: Samsung SmartStore CI/CD

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            cd /opt/samsung-smartstores

            git pull origin main

            docker stop samsung-smartstore || true
            docker rm samsung-smartstore || true

            docker build -t samsung-smartstore .

            docker run -d \
              --name samsung-smartstore \
              --restart unless-stopped \
              -p 5000:5000 \
              -e FLASK_ENV=production \
              -e SECRET_KEY=SamsungSecretKey \
              -v /opt/samsung-smartstores/instance:/app/instance \
              samsung-smartstore

            sleep 5

            curl -f http://127.0.0.1:5000/health